root = "."
tmp_dir = "tmp"

[build]
args_bin = ["serve", "--http", "127.0.0.1:8090"]
cmd = "go build -o ./tmp/weftbase ./cmd/weftbase"
delay = 1000
entrypoint = ["./tmp/weftbase"]
exclude_dir = ["tmp", "vendor", "pb_data"]
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[misc]
clean_on_exit = true
